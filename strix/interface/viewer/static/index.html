<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Strix Results</title>
    <script type="module" crossorigin src="./assets/index-DzvI_0HX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3kQ5kk8.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      console.log('[Strix] Loading interception scripts');

      // Intercept all navigation to strix.ai
      const originalAssign = window.location.assign;
      const originalReplace = window.location.replace;

      window.location.assign = function(url) {
        console.log('[Strix] location.assign called with:', url);
        if (typeof url === 'string' && url.includes('strix.ai')) {
          console.log('[Strix] Blocking redirect to strix.ai, going to /jira-sync instead');
          const runParam = new URLSearchParams(window.location.search).get('run');
          window.location.href = '/jira-sync' + (runParam ? '?run=' + runParam : '');
          return;
        }
        return originalAssign.apply(window.location, [url]);
      };

      window.location.replace = function(url) {
        console.log('[Strix] location.replace called with:', url);
        if (typeof url === 'string' && url.includes('strix.ai')) {
          console.log('[Strix] Blocking redirect to strix.ai, going to /jira-sync instead');
          const runParam = new URLSearchParams(window.location.search).get('run');
          window.location.href = '/jira-sync' + (runParam ? '?run=' + runParam : '');
          return;
        }
        return originalReplace.apply(window.location, [url]);
      };

      // Intercept fetch calls before React attaches handlers
      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        const url = typeof args[0] === 'string' ? args[0] : (args[0] instanceof Request ? args[0].url : '');
        console.log('[Strix] fetch called:', url);

        // Intercept Jira sync requests
        if (url.includes('/api/jira/sync')) {
          console.log('[Strix] Intercepting jira sync, redirecting to form');
          const runParam = new URLSearchParams(window.location.search).get('run');
          window.location.href = '/jira-sync' + (runParam ? '?run=' + runParam : '');
          return Promise.reject(new Error('redirecting'));
        }

        // Block email report send and redirect
        if (url.includes('/api/report/send')) {
          console.log('[Strix] Intercepting report send');
          const runParam = new URLSearchParams(window.location.search).get('run');
          window.location.href = '/?tab=forecast' + (runParam ? '&run=' + runParam : '');
          return Promise.reject(new Error('redirecting'));
        }

        return originalFetch.apply(this, args);
      };

      // Also intercept XMLHttpRequest
      const originalXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (url.includes('/api/jira/sync') || url.includes('/api/report/send')) {
          throw new Error('request blocked');
        }
        return originalXHROpen.apply(this, [method, url, ...args]);
      };

      // Watch for any element that might be a link to strix.ai
      document.addEventListener('click', (e) => {
        const target = e.target.closest('a[href*="strix.ai"], button');
        if (target) {
          console.log('[Strix] Click detected on:', target.tagName, target.href || target.textContent);
        }
      }, true);

      // Hide email export and replace with message
      setTimeout(() => {
        const observer = new MutationObserver(() => {
          const text = document.body.innerText;
          if (text.includes('EMail') && text.includes('PDF')) {
            const root = document.getElementById('root');
            if (root && !root.dataset.replacedEmailView) {
              root.dataset.replacedEmailView = 'true';
              root.innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;">
                  <div style="text-align: center; padding: 40px;">
                    <h1 style="margin: 0 0 20px 0;">Email Export Disabled</h1>
                    <p style="margin: 0 0 30px 0; color: #aaa;">This feature is no longer available.</p>
                    <p style="margin: 0 0 30px 0; color: #aaa;">Use the <strong>Export report to .md</strong> button to download your report as markdown instead.</p>
                    <button onclick="window.history.back()" style="padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">← Back to Results</button>
                  </div>
                </div>
              `;
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });
      }, 500);
    </script>
  </body>
</html>
