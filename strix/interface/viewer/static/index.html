<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Strix Results</title>
    <script type="module" crossorigin src="./assets/index-DzvI_0HX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3kQ5kk8.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Intercept clicks to app.strix.ai and redirect to local /jira-sync
      document.addEventListener('click', function(e) {
        const target = e.target.closest('a');
        if (target && target.href && target.href.includes('app.strix.ai')) {
          e.preventDefault();
          e.stopPropagation();
          const runParam = new URLSearchParams(window.location.search).get('run');
          window.location.href = '/jira-sync' + (runParam ? '?run=' + runParam : '');
        }
      }, true);

      // Rename email/PDF button to markdown export
      const observer = new MutationObserver(() => {
        document.querySelectorAll('button').forEach(btn => {
          if (btn.textContent.includes('EMail') || btn.textContent.includes('PDF')) {
            btn.textContent = 'Export report to .md';
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
