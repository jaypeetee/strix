<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Strix Results</title>
    <script type="module" crossorigin src="./assets/index-DzvI_0HX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3kQ5kk8.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Block all navigation to strix.ai at the earliest point
      const originalReplace = History.prototype.replaceState;
      const originalPush = History.prototype.pushState;

      History.prototype.replaceState = function(...args) {
        if (args[2] && String(args[2]).includes('strix.ai')) return;
        return originalReplace.apply(this, args);
      };

      History.prototype.pushState = function(...args) {
        if (args[2] && String(args[2]).includes('strix.ai')) return;
        return originalPush.apply(this, args);
      };

      // Intercept window.location changes
      let inNavigation = false;
      const navHandler = {
        get(target, prop) {
          if (prop === 'href') {
            return target.href;
          }
          if (prop === 'assign' || prop === 'replace') {
            return function(url) {
              if (String(url).includes('strix.ai')) {
                const runParam = new URLSearchParams(window.location.search).get('run');
                target.href = '/jira-sync' + (runParam ? '?run=' + runParam : '');
                return;
              }
              return target[prop](url);
            };
          }
          return Reflect.get(target, prop);
        },
        set(target, prop, value) {
          if (prop === 'href' && String(value).includes('strix.ai')) {
            const runParam = new URLSearchParams(window.location.search).get('run');
            return Reflect.set(target, prop, '/jira-sync' + (runParam ? '?run=' + runParam : ''));
          }
          return Reflect.set(target, prop, value);
        }
      };

      try {
        Object.defineProperty(window, 'location', {
          get: () => new Proxy(window.location, navHandler),
          configurable: true
        });
      } catch (e) {
        console.log('Could not proxy location');
      }

      // Wait for React to render, then hide email export and add custom buttons
      setTimeout(() => {
        // Hide the email export card by finding it
        const hideEmailCard = () => {
          document.querySelectorAll('*').forEach(el => {
            if (el.textContent && el.textContent.includes('EMail') && el.textContent.includes('encrypted PDF')) {
              const card = el.closest('[class*="Card"], [class*="View"], div');
              if (card) card.style.display = 'none';
            }
          });
        };

        hideEmailCard();
        const observer = new MutationObserver(hideEmailCard);
        observer.observe(document.body, { childList: true, subtree: true });

        // Add custom action buttons at the top
        const topSection = document.querySelector('[class*="Header"], [class*="Top"], header') ||
                          document.querySelector('div[class*="Container"]');

        if (!document.getElementById('custom-actions')) {
          const actionsDiv = document.createElement('div');
          actionsDiv.id = 'custom-actions';
          actionsDiv.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            gap: 8px;
          `;
          actionsDiv.innerHTML = `
            <button onclick="fetch('/api/report/markdown').then(r=>r.json()).then(d=>{const b=new Blob([d.markdown],{type:'text/markdown'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=d.filename||'strix-report.md';a.click();URL.revokeObjectURL(u)}).catch(e=>alert('Export failed: '+e.message))" style="padding:8px 16px;background:#0066cc;color:white;border:none;border-radius:4px;cursor:pointer;font-size:14px;">Export .md</button>
            <button onclick="const run=new URLSearchParams(window.location.search).get('run');window.location='/jira-sync'+(run?'?run='+run:'')" style="padding:8px 16px;background:#0066cc;color:white;border:none;border-radius:4px;cursor:pointer;font-size:14px;">Sync to Jira</button>
          `;
          document.body.appendChild(actionsDiv);
        }
      }, 1000);
    </script>
  </body>
</html>
